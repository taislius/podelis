[package]
name = "podelis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A terminal UI database client for PostgreSQL, MySQL, SQLite, DuckDB and MongoDB"
license.workspace = true
repository.workspace = true
readme = "README.md"
exclude = [".github/", ".githooks/", "docs/demo.gif", "packaging/", "patches/"]
keywords = ["sql", "tui", "postgres", "mysql", "database"]
categories = ["command-line-utilities", "database"]
# Installed from git (`cargo install --git`), never from crates.io: its
# `podelis-core` is a path in the workspace.
publish = false

[dependencies]
podelis-core = { path = "crates/podelis-core", default-features = false }
# Its engines are the ones turned on here (through podelis-core).
podelis-ai = { path = "crates/podelis-ai", default-features = false }
anyhow.workspace = true
chrono.workspace = true
crossterm.workspace = true
csv.workspace = true
dirs.workspace = true
flate2.workspace = true
ratatui.workspace = true
rmcp.workspace = true
serde.workspace = true
serde_json.workspace = true
# The gateway holds each project's memory connection (SQLite, always built).
sqlx.workspace = true
tokio.workspace = true
toml.workspace = true
# Changing a setting in config.toml keeps the file's comments and layout.
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-width.workspace = true
url.workspace = true
uuid.workspace = true
# Parquet exports (transfer/parquet.rs): Snappy only, no other codecs.
parquet.workspace = true
arrow-array.workspace = true
arrow-schema.workspace = true

[features]
# The database engines built in (each a `crates/podelis-core/src/db/<engine>/`
# folder): build fewer with `--no-default-features --features postgres`, say.
default = ["postgres", "mysql", "sqlite"]
postgres = ["podelis-core/postgres"]
mysql = ["podelis-core/mysql"]
sqlite = ["podelis-core/sqlite"]
# Opt-in for now (`--features duckdb`): its driver builds DuckDB from C++.
duckdb = ["podelis-core/duckdb"]
# Opt-in for now (`--features mongodb`): the first engine without SQL.
mongodb = ["podelis-core/mongodb"]

[dev-dependencies]
podelis-core = { path = "crates/podelis-core", default-features = false, features = ["test-support"] }
insta.workspace = true
proptest.workspace = true
# An MCP client, to test `podelis mcp` over the real protocol.
rmcp = { workspace = true, features = ["client"] }
tempfile.workspace = true

[lints]
workspace = true

[workspace]
members = [".", "crates/podelis-core", "crates/podelis-ai"]
# Plain `cargo build`, `test` and `clippy` cover both.
default-members = [".", "crates/podelis-core", "crates/podelis-ai"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.94" # sqlx 0.9; rust-toolchain.toml pins the newer compiler used for development
license = "AGPL-3.0-only"
repository = "https://github.com/taislius/podelis"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["osc52"] }
csv = "1.4.0"
dirs = "7.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
keyring = "4.2.0" # default `v1`: Keychain on macOS, Secret Service (zbus) on Linux
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream", "system-proxy"] } # the gateway's model APIs; rustls on aws-lc-rs, as sqlx
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rmcp = { version = "3.5.1", features = ["transport-io", "server", "macros"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlformat = "0.5.0"
sqlparser = { version = "0.63", features = ["visitor"] }
# SQLite is always built: the gateway keeps each project's memory in it.
# The other drivers come with their engines' features.
duckdb = { version = "=1.10506.1", features = ["bundled"] }
mongodb = { version = "=3.9.1" }
# 59: the first without thrift (an unbounded allocation reading its
# protocol: RUSTSEC) and paste (unmaintained). DuckDB's arrow is 58: a
# build with both has two arrows, which never meet.
parquet = { version = "=59.3.1", default-features = false, features = ["arrow", "snap"] }
arrow-array = "59"
arrow-schema = "59"
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "tls-rustls-aws-lc-rs", "chrono", "rust_decimal", "uuid", "json"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync", "net", "process", "io-util", "signal"] }
toml = "1.1.6"
# Changing a setting in config.toml keeps the file's comments and layout.
toml_edit = "0.25.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std"] }
unicode-width = "0.2.2"
url = "2.5"
uuid = { version = "1.27.0", features = ["v4"] }
insta = "1"
proptest = "1"
tempfile = "3"

[profile.release]
# Smaller, faster release binaries (22 → 16 MB). Function names stay, so
# crash.log backtraces remain readable; only debug info is dropped.
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Deliberate in this codebase:
cast_possible_truncation = "allow" # terminal coordinates are u16; values are clamped before casting
cast_possible_wrap = "allow"       # ids/ports cast between integer types of known range
wildcard_imports = "allow"         # `use super::*` in the app's per-screen modules
struct_excessive_bools = "allow"   # UI state flags
items_after_statements = "allow"   # local consts next to where they're used
assert_is_empty = "allow"          # `assert!(x.is_empty())` reads better than `assert_eq!(x, [] as [T; 0])`
# Library crates here aren't published: their callers are the app, so what
# a public API would need is noise.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Catch leftovers:
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
print_stdout = "warn"              # the TUI owns the terminal; see parse_args for the exception
print_stderr = "warn"
# Every suppression says why, and goes once it isn't needed:
# `#[expect(lint, reason = "…")]`, not `#[allow]`.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# No unwrap() outside tests: `?`, or expect("why it can't fail").
unwrap_used = "warn"
redundant_clone = "warn"
clone_on_ref_ptr = "warn"          # Arc::clone(&x), so a cheap clone reads as one

# sqlx-mysql 0.9.0 with two fixes: a user without a password gets an empty
# auth response, not a scramble of "" (public servers that switch the auth
# plugin, such as Rfam's, refuse that); and RSA through aws-lc-rs instead of
# the `rsa` crate (RUSTSEC-2023-0071). See patches/README.md.
[patch.crates-io]
sqlx-mysql = { path = "patches/sqlx-mysql" }
