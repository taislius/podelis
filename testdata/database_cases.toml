# Every case of the database interface, and what proves each.
#
# One entry a case: what Podėlis must do with a database. Each engine's
# status (`pg`, `mysql`, `sqlite`, `duckdb`, `mongo`; a missing one isn't
# assessed yet):
#
#   tested   handled, and the tests named show it (on a live server)
#   partial  some of it: `note` says what's missing
#   code     handled in code, no live test yet
#   driver   the driver can't (sqlx, the MongoDB driver): a patch or a workaround
#   no       not handled
#   na       doesn't apply to that engine
#
# `tests` are test functions in the workspace. `src/database_cases.rs`
# checks this file: every test named exists, a `tested` case names one,
# every live test (`fn live_…` with a test attribute) is claimed by a
# case, ids are unique; and prints what's left to do per area.
#
# Versions: CI's `versions` job runs the live tests on PostgreSQL 13, 16
# and 18, MySQL 5.7 and 8.0, MariaDB 11.4; the main job on PostgreSQL 17
# and MySQL 8.4. A case `tested` holds for those.

# ── Versions and servers ─────────────────────────────────────────────

[[case]]
id = "server.version_said"
what = "The server's version read and said against what's supported (Aurora, TiDB, Redshift… named)"
pg = "code"
mysql = "code"
note = "Backend::support in db/server.rs; no live test asserts the words"

[[case]]
