# This folder is a database engine: build.rs finds it by this file.
name = "Postgres"   # its Engine variant, as connections.toml writes it
order = 1    # its place in lists (the connection form cycles in this order)
label = "PostgreSQL"   # its name as people know it (Backend::label; scripts/build.sh shows it)
feature = "postgres"   # its Cargo feature: builds its driver
