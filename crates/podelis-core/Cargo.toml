[package]
name = "podelis-core"
description = "Podėlis's databases and SQL: the engines (ports and adapters), SQL text and analysis, and the words it says"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
# Not a native library: lets its build script tell the app's which engines
# are built (`cargo::metadata`, read as DEP_PODELIS_CORE_*).
links = "podelis_core"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
futures-util.workspace = true
# The OS keychain: `v1` (Keychain on macOS, Secret Service through zbus on Linux).
keyring.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlformat.workspace = true
sqlparser.workspace = true
sqlx.workspace = true
# DuckDB's driver (`duckdb`, opt-in): sync, run on blocking threads.
duckdb = { workspace = true, optional = true }
# MongoDB's driver (`mongodb`, opt-in): the official one, async on tokio.
mongodb = { workspace = true, optional = true }
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-width.workspace = true
uuid.workspace = true
# For `test-support`: the shared test helpers make scratch databases.
tempfile = { workspace = true, optional = true }

[features]
# The database engines built in (each a `src/db/<engine>/` folder): build
# fewer with `--no-default-features --features postgres`, say.
default = ["postgres", "mysql", "sqlite"]
postgres = ["sqlx/postgres", "via-sqlx"]
# With RSA: MySQL 8's login sends the password RSA-encrypted when there's no
# TLS and the server hasn't cached the user's login (after a restart). The
# patched sqlx-mysql (patches/) does it with aws-lc-rs, not the `rsa` crate.
mysql = ["sqlx/mysql", "sqlx/mysql-rsa", "via-sqlx"]
sqlite = ["via-sqlx"]
# Opt-in (not in `default`): its driver builds DuckDB from C++.
duckdb = ["dep:duckdb"]
# Opt-in (not in `default`): the first engine without SQL.
mongodb = ["dep:mongodb"]
# What the engines that talk through sqlx share (`db/via_sqlx.rs`): each
# of their features turns it on.
via-sqlx = []
# The tests' helpers (`db::tests`: test servers, scratch databases, file
# connections), for the app's own tests.
test-support = ["dep:tempfile"]

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
