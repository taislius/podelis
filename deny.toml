# cargo-deny: run `cargo deny check` (CI does this on every push).

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities and on unmaintained/yanked crates in use.
yanked = "deny"
# Unmaintained, not vulnerable: merged into zbus 6, which secret-service
# (keyring's Linux store, through zbus 5) doesn't use yet. Remove these
# once secret-service moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; secret-service still on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; secret-service still on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; secret-service still on zbus 5" },
]

[licenses]
# Permissive licences compatible with shipping under AGPL-3.0-only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = [
    # Podelis itself. Dependencies stay permissive, so closed builds are possible.
    { allow = ["AGPL-3.0-only"], crate = "podelis" },
    # File-level copyleft, used unmodified (pulled in by `dirs`).
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
