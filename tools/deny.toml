# cargo-deny: run `cargo deny --config tools/deny.toml check` (check.sh does,
# and CI when dependencies change, and weekly).

[graph]
all-features = true

[advisories]
# Fail on known vulnerabilities and on unmaintained/yanked crates in use.
yanked = "deny"
# Unmaintained, not vulnerable: merged into zbus 6, which secret-service
# (keyring's Linux store, through zbus 5) doesn't use yet. Remove these
# once secret-service moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; secret-service still on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; secret-service still on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; secret-service still on zbus 5" },
    # SQLite before 3.54.0 can return stale memory for a crafted database
    # file opened with a `-wal` of another page size: local, and only for a
    # file pair someone else made. sqlx 0.9.0 (the latest) pins
    # libsqlite3-sys 0.37; remove this once a sqlx takes 0.39.
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.37 pinned by sqlx 0.9.0, the latest; needs a sqlx on 0.39" },
]

[licenses]
# Permissive licences compatible with shipping under AGPL-3.0-only.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
exceptions = [
    # Podelis itself (both crates of its workspace). Dependencies stay
    # permissive, so closed builds are possible.
    { allow = ["AGPL-3.0-only"], crate = "podelis" },
    { allow = ["AGPL-3.0-only"], crate = "podelis-core" },
    { allow = ["AGPL-3.0-only"], crate = "podelis-ai" },
    # File-level copyleft, used unmodified (pulled in by `dirs`).
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates by path (`podelis-core`), not a version range.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
