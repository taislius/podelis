# cargo-mutants: `cargo mutants` changes the code (a `<` for `<=`, a body
# for `Default::default()`) and checks that a test fails; a mutant that
# lives is code the tests run without checking. Scoped to where a bug
# hurts users most: what AI agents may run, what each engine refuses
# them, the OS keychain, the MCP server and the gateway's socket
# (podelis-planai's code-review.md). Run with
# `cargo mutants --workspace`: part of it is the core's.
examine_globs = [
    "src/agents/mod.rs",
    "crates/podelis-core/src/db/agent_constraints.rs",
    "crates/podelis-core/src/db/*/agent_constraints.rs",
    "crates/podelis-core/src/db/keychain.rs",
    # How agents reach the databases, and the gateway's socket (who may
    # connect, one gateway per config folder).
    "src/agents/mcp.rs",
    "src/gateway/server.rs",
]
# The core's rules are tested in the app's crate (src/agents/engines.rs).
test_workspace = true
# Not worth a test, each for its reason:
exclude_re = [
    # The keychain's error wording by OS (no Secret Service on Linux): no
    # test can make the keyring crate fail that way.
    "keyring_entry",
    # A print to stderr that may fail, and `podelis mcp`'s process entry
    # (it copies bytes between the agent and the gateway).
    "eprintln_safe",
    "agents/mcp.rs:.*replace run -> i32",
    # The gateway gives clients a second to read that it stops before the
    # process ends: in a test the process goes on, so it can't be seen.
    "let_clients_read",
    # Only which error is told when an old socket file can't be removed:
    # binding fails right after anyway.
    "in bind$",
    # The schema's size limit, `>` or `>=`: they differ at one exact byte
    # count of a schema's text (the cut itself is tested).
    "replace > with >= in Server::schema",
]
# Reported as missed, and equivalent: two mutants of how a sandbox's
# savepoints are numbered (leaving `calls` out of its update, and
# `calls + 1` as `calls * 1`): they then all have one name, which behaves
# the same. Not excluded: cargo-mutants doesn't apply `exclude_re` to a
# deleted struct field, and the second reads like the sandbox's own number
# (`+ 1` a few lines up), which the tests do catch.
