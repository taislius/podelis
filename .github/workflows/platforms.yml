name: Platforms

# macOS minutes cost several times Linux minutes, so these run
# weekly, on release tags, or by hand (Actions tab → Platforms → Run).
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # SQLite-backed tests need no server, so they run everywhere.
      - run: cargo test --locked
