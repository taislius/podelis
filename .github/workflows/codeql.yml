name: CodeQL

# GitHub's code scanning: data-flow queries over the Rust code (a secret
# reaching a log, input reaching a path or a command) and over these
# workflows (script injection). Findings go to Security → Code scanning,
# not to a failed run. Free on a public repository. On pushes to master
# that change code, and weekly (new queries arrive with CodeQL itself).
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "packaging/**", "docker/**", ".dockerignore", "LICENSE"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [rust, actions]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Rust is read from the source: no build needed.
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
