name: Dependencies

# Licences, advisories and sources: when dependencies change, and weekly
# (new advisories appear without any change here).
on:
  push:
    branches: [master]
    paths: ["Cargo.toml", "Cargo.lock", "deny.toml", "osv-scanner.toml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # A second source of advisories: OSV has GitHub's as well as RustSec's.
  osv:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Scan Cargo.lock
        run: |
          curl -fsSL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile Cargo.lock --config osv-scanner.toml
