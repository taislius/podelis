name: Dependencies

# Licences, advisories and sources, and dependencies no code uses: when
# dependencies change, and weekly (new advisories appear without any
# change here, and code can stop using a dependency).
on:
  push:
    branches: [master]
    paths: ["Cargo.toml", "crates/*/Cargo.toml", "patches/*/Cargo.toml", "Cargo.lock", "deny.toml", "osv-scanner.toml"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# The token may read the code, nothing more.
permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  # A dependency in a crate's Cargo.toml that its code never names (fast,
  # by searching the source; a false alarm goes in that manifest's
  # `[package.metadata.cargo-machete] ignored`).
  machete:
    name: cargo-machete
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  # A second source of advisories: OSV has GitHub's as well as RustSec's.
  osv:
    name: osv-scanner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Scan Cargo.lock
        run: |
          curl -fsSL -o osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.7.0/osv-scanner_linux_amd64
          echo "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile Cargo.lock --config osv-scanner.toml
