name: CI

# Kept small to save Actions minutes: Linux only, docs-only pushes skipped,
# and a newer push cancels the older run. macOS builds live in
# platforms.yml, dependency checks in deny.yml.
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "docs/**", "packaging/**", "docker/**", ".dockerignore", "LICENSE"]
  # By hand, e.g. after a force-push, which may not start a run.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The token may read the code, nothing more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint & test (live PostgreSQL, MySQL, SQLite)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 2s --health-timeout 5s --health-retries 60
    env:
      PODELIS_TEST_PG_PORT: 5432
      PODELIS_TEST_PG_PASSWORD: postgres
      PODELIS_TEST_MYSQL_PORT: 3306
      PODELIS_TEST_MYSQL_PASSWORD: root
    steps:
      - uses: actions/checkout@v5
      # Installs the version pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # Built with fewer engines (`--no-default-features --features …`): the
  # README's PostgreSQL and SQLite, and each engine alone; and with the
  # opt-in ones, beside the others and alone: DuckDB (its driver builds
  # DuckDB from C++) and MongoDB (the first engine without SQL, its live
  # tests on the mongo service). Code and tests
  # mustn't assume an engine is there (a test that needs SQLite's files
  # says so with `#[cfg(feature = "sqlite")]`); clippy as well, as what goes
  # unused with fewer engines is allowed only in such builds. Beside the
  # job above, so a run takes no longer; the same servers, so each build's
  # live tests run.
  engines:
    name: Engines (${{ matrix.features }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `key` names its cache: a cache key can't hold commas.
        include:
          - { features: "postgres,sqlite", key: postgres-sqlite }
          - { features: postgres, key: postgres }
          - { features: mysql, key: mysql }
          - { features: sqlite, key: sqlite }
          - { features: "postgres,mysql,sqlite,duckdb", key: with-duckdb }
          - { features: duckdb, key: duckdb }
          - { features: "postgres,mysql,sqlite,mongodb", key: with-mongodb }
          - { features: mongodb, key: mongodb }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -proot" --health-interval 2s --health-timeout 5s --health-retries 60
      # 7.0, not 8: MongoDB 8.0 and later crash on Linux 6.19 and newer
      # kernels, as the runners' (SERVER-121912); 7.0 is supported to 2027.
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1}).ok'" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PODELIS_TEST_PG_PORT: 5432
      PODELIS_TEST_PG_PASSWORD: postgres
      PODELIS_TEST_MYSQL_PORT: 3306
      PODELIS_TEST_MYSQL_PASSWORD: root
      PODELIS_TEST_MONGO_PORT: 27017
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.key }}
      - run: cargo clippy --all-targets --locked --no-default-features --features ${{ matrix.features }} -- -D warnings
      - run: cargo test --locked --no-default-features --features ${{ matrix.features }}
