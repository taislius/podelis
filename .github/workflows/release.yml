name: Release

# Push a tag like v0.2.0 to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain from rust-toolchain.toml, plus this target.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Licences and notices of every bundled crate, shipped with the binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # No prebuilt cargo-about for some targets (Intel macOS): the action's
      # fallback then builds it without the `cli` feature, so no command.
      - run: cargo about --version || cargo install cargo-about --locked --features cli
        shell: bash
      - run: ./scripts/third-party-licenses.sh
        shell: bash
      - name: Package
        shell: bash
        run: |
          name=podelis-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE THIRD-PARTY-LICENSES.txt "$name"/
          mkdir "$name"/docs
          cp docs/*.md "$name"/docs/
          cp target/${{ matrix.target }}/release/podelis docs/podelis.1 "$name"/
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum > /dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"
          else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256

  # Points the Homebrew tap at the new release. Needs a token that can push
  # to taislius/homebrew-tap (a fine-grained one with Contents: read and
  # write on that repository) as the HOMEBREW_TAP_TOKEN secret; without it,
  # or for a pre-release tag (v1.0.0-rc.1), this is skipped.
  homebrew:
    needs: build
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Check
        id: check
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "No HOMEBREW_TAP_TOKEN secret: skipping the tap."
          elif [[ "$GITHUB_REF_NAME" == *-* ]]; then echo "A pre-release: skipping the tap."
          else echo "update=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.update == 'yes'
      - uses: actions/checkout@v4
        if: steps.check.outputs.update == 'yes'
        with:
          repository: taislius/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the formula
        if: steps.check.outputs.update == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          gh release download "$GITHUB_REF_NAME" --pattern '*.sha256' --dir sums
          ./scripts/homebrew-formula.sh "$version" sums > tap/Formula/podelis.rb
          ruby -c tap/Formula/podelis.rb
          cd tap
          git diff --quiet && { echo "The tap already has $version."; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Podėlis $version"
          git push
