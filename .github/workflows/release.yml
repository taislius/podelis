name: Release

# Push a tag like v0.2.0 to build binaries and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # The pinned toolchain from rust-toolchain.toml, plus this target.
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Licences and notices of every bundled crate, shipped with the binary.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - run: ./scripts/third-party-licenses.sh
        shell: bash
      - name: Package
        shell: bash
        run: |
          name=podelis-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md LICENSE THIRD-PARTY-LICENSES.txt "$name"/
          mkdir "$name"/docs
          cp docs/*.md "$name"/docs/
          cp target/${{ matrix.target }}/release/podelis docs/podelis.1 "$name"/
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Checksum
        shell: bash
        run: |
          if command -v sha256sum > /dev/null; then sha256sum "$ASSET" > "$ASSET.sha256"
          else shasum -a 256 "$ASSET" > "$ASSET.sha256"; fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.sha256
