name: Retry

# A release tag's builds and the macOS tests sometimes fail for reasons of
# GitHub's own: a macOS runner never picked up ("not acquired… after
# multiple attempts", arm64 capacity), an API timeout. Their failed jobs are
# run once more by themselves; a second failure is left for a person.
on:
  workflow_run:
    workflows: [Release, Platforms]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.event.workflow_run.id }}
    steps:
      - run: gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY"
